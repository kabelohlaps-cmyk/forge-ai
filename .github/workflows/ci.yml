name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @forge/web exec tsc --noEmit
      - name: Build
        run: pnpm --filter @forge/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://forge:forge@localhost:5432/forge
      PGPASSWORD: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches services/api/Dockerfile
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pip install -r services/api/requirements-dev.txt
      - name: Load schema
        run: psql -h localhost -U forge -d forge -v ON_ERROR_STOP=1 -f services/api/app/schema.sql
      - name: Tests
        working-directory: services/api
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://forge:forge@localhost:5432/forge
      - name: Smoke test
        working-directory: services/api
        run: |
          export JWT_SECRET=$(openssl rand -hex 32)
          export ENCRYPTION_MASTER_KEY=$(openssl rand -base64 32)
          uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-pass-123","name":"CI"}' | grep -q '"token"'
          curl -sf -X POST localhost:8000/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-pass-123"}' | grep -q '"token"'
      - name: API log
        if: always()
        run: cat services/api/uvicorn.log || true
