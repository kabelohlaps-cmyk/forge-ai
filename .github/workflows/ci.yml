name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @forge/web exec tsc --noEmit
      - name: Build
        run: pnpm --filter @forge/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://forge:forge@localhost:5432/forge
      PGPASSWORD: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches services/api/Dockerfile
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pip install -r services/api/requirements-dev.txt
      - name: Load schema
        run: psql -h localhost -U forge -d forge -v ON_ERROR_STOP=1 -f services/api/app/schema.sql
      - name: Tests
        working-directory: services/api
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://forge:forge@localhost:5432/forge
      - name: Smoke test
        working-directory: services/api
        run: |
          export JWT_SECRET=$(openssl rand -hex 32)
          export ENCRYPTION_MASTER_KEY=$(openssl rand -base64 32)
          uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-pass-123","name":"CI"}' | grep -q '"token"'
          curl -sf -X POST localhost:8000/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-pass-123"}' | grep -q '"token"'
      - name: API log
        if: always()
        run: cat services/api/uvicorn.log || true

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://forge:forge@localhost:5432/forge
      PGPASSWORD: forge
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r services/api/requirements.txt
      - name: Load schema
        run: psql -h localhost -U forge -d forge -v ON_ERROR_STOP=1 -f services/api/app/schema.sql
      - name: Build web
        run: pnpm --filter @forge/web build
      - name: Start API and web
        run: |
          (cd services/api && JWT_SECRET=$(openssl rand -hex 32) ENCRYPTION_MASTER_KEY=$(openssl rand -base64 32) \
            uvicorn app.main:app --port 8000 > ../../api.log 2>&1 &)
          NEXTAUTH_SECRET=$(openssl rand -base64 32) pnpm --filter @forge/web start > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health > /dev/null && curl -sf -o /dev/null localhost:3000/ && exit 0
            sleep 1
          done
          echo "servers did not come up"; cat api.log web.log; exit 1
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Server logs
        if: failure()
        run: cat api.log web.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
